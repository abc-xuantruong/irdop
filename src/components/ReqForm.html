<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Phiếu Gửi Mẫu Thử Nghiệm</title>
		<style>
			body {
				background-color: #f3f4f6;
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 5px;
				box-sizing: border-box;
				line-height: 1.4;
			}
			.container {
				background-color: #ffffff;
				padding: 1rem;
				border-radius: 0.5rem;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
				width: 100%;
				max-width: 1000px;
				margin: 0 auto;
				h1 {
					font-size: 1.75rem;
					font-weight: bold;
					text-align: center;
					margin-bottom: 1rem;
					color: #1f2937;
				} /* Card Layout */
				.info-card {
					border: 2px solid #e0e0e0;
					margin: 15px 0;
					padding: 10px;
					background-color: #f9f9f9;
					border-radius: 8px;
					box-sizing: border-box;
				}
				.info-card h3 {
					color: #2563eb;
					margin-top: 0;
					margin-bottom: 15px;
					display: flex;
					align-items: center;
					gap: 8px;
					font-size: 1.1rem;
					font-weight: 600;
				}

				/* Compact Form Groups */
				.form-row {
					display: flex;
					align-items: center;
					margin: 8px 0;
					flex-wrap: wrap;
					gap: 10px;
				}
				.form-row label {
					font-weight: 600;
					color: #374151;
					min-width: 140px;
					font-size: 0.9rem;
				}
				.form-row input,
				.form-row select,
				.form-row textarea {
					flex: 1;
					padding: 8px 12px;
					border: 1px solid #d1d5db;
					border-radius: 4px;
					font-size: 0.9rem;
					min-width: 200px;
					transition: border-color 0.2s, box-shadow 0.2s;
				}

				/* Reset font cho textarea */
				.form-row textarea,
				textarea {
					font-family: Arial, sans-serif;
					font-size: 14px;
					line-height: 1.4;
				}
				.form-row input:focus,
				.form-row select:focus,
				.form-row textarea:focus,
				.info-field-select:focus,
				.additional-info-input:focus,
				.custom-field-name:focus {
					outline: none;
					border-color: #3b82f6;
					box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
				}
				/* Additional info specific styles */
				.info-field-select {
					width: 100px;
					padding: 6px 2px;
					border: 1px solid #d1d5db;
					border-radius: 4px;
					font-weight: 500;
					background-color: white;
					box-sizing: border-box;
				} /* Prevent overlapping */
				.additional-info-item,
				.analysis-item {
					display: flex;
					align-items: center;
					margin-bottom: 10px;
					gap: 5px;
				} /* CSS cho Additional info và Analysis parameters container */
				.additional-analysis-container {
					display: flex;
					flex-direction: row;
					gap: 15px;
					margin: 15px 0;
					box-sizing: border-box;
				}
				.additional-info-box,
				.analysis-parameters-box {
					border: 1px solid #e5e7eb;
					border-radius: 6px;
					padding: 10px;
					background-color: #f9fafb;
					box-sizing: border-box;
				}
				.additional-info-box {
					flex: 0.5;
					min-width: 0;
				}

				.analysis-parameters-box {
					flex: 0.5;
					min-width: 0;
				}

				.field-label-container {
					width: 100px;
					min-width: 100px;
					flex-shrink: 0;
					display: flex;
					align-items: center;
				}
				.additional-info-input,
				.parameter-name-input,
				.parameter-price-input {
					flex: 1;
					min-width: 0;
					padding: 6px 2px;
					border: 1px solid #d1d5db;
					border-radius: 4px;
					box-sizing: border-box;
				}
				.parameter-price-input {
					flex: none;
					width: 80px;
					background-color: #f3f4f6;
					cursor: not-allowed;
				}

				.parameter-price-input:read-only {
					background-color: #f3f4f6;
					border-color: #d1d5db;
					cursor: not-allowed;
				}
				.remove-btn {
					min-width: 30px;
					width: 30px;
					flex-shrink: 0;
					background: none;
					border: none;
					color: #dc2626;
					opacity: 0.7;
					cursor: pointer;
					font-size: 16px;
					padding: 4px 8px;
					transition: opacity 0.2s;
					text-align: center;
				}

				.remove-btn:hover {
					opacity: 1;
				}
				.form-row input[type='checkbox'] {
					width: auto;
					min-width: auto;
					margin-right: 8px;
				} /* Two Column Layout */
				.two-column {
					display: grid;
					grid-template-columns: 1fr 1fr;
					gap: 10px;
				} /* Full width address field on desktop */
				.full-width-address,
				.full-width-description {
					grid-column: 1 / -1;
				} /* Custom dropdown styles */
				.copy-dropdown-btn {
					padding: 10px 15px;
					font-size: 1rem;
					border: 1px solid #d1d5db;
					border-radius: 4px;
					background-color: white;
					min-width: 200px;
					cursor: pointer;
					display: flex;
					justify-content: space-between;
					align-items: center;
					transition: border-color 0.2s, box-shadow 0.2s;
				}

				.copy-dropdown-btn:hover {
					border-color: #3b82f6;
					box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
				}

				.dropdown-container {
					position: absolute;
					top: 100%;
					left: 0;
					right: 0;
					background: white;
					border: 1px solid #d1d5db;
					border-radius: 4px;
					box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
					z-index: 1000;
					display: none;
					max-height: 200px;
					overflow-y: auto;
				}
				.dropdown-item {
					padding: 10px 15px;
					cursor: pointer;
					border-bottom: 1px solid #f3f4f6;
					transition: background-color 0.2s;
					text-align: left;
				}

				.dropdown-item:hover {
					background-color: #f3f4f6;
				}

				.dropdown-item:last-child {
					border-bottom: none;
				}
				.dropdown-empty {
					padding: 15px;
					text-align: center;
					color: #6b7280;
					font-style: italic;
				}
				/* Editable field and value container */
				.additional-info-item {
					display: flex;
					align-items: center;
					margin-bottom: 10px;
					gap: 8px;
					border: 1px solid #e5e7eb;
					border-radius: 4px;
					padding: 4px;
					background-color: white;
				}
				.editable-field-input {
					width: 140px;
					padding: 6px 8px;
					box-sizing: border-box;
					border: none;
					border-right: 1px solid #e5e7eb;
					border-radius: 0;
					font-weight: 500;
					background-color: #f9f9f9;
					cursor: text;
					transition: background-color 0.2s;
					flex-shrink: 0;
				}

				.editable-field-input:focus {
					outline: none;
					background-color: white;
					border-right-color: #3b82f6;
				}
				.field-dropdown {
					position: absolute;
					top: 100%;
					left: 0;
					width: 140px;
					background: white;
					border: 1px solid #d1d5db;
					border-radius: 4px;
					box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
					z-index: 1000;
					display: none;
					max-height: 200px;
					overflow-y: auto;
					scrollbar-width: thin;
					scrollbar-color: #cbd5e1 transparent;
				}

				/* Webkit scrollbar styles for Chrome/Safari */
				.field-dropdown::-webkit-scrollbar {
					width: 6px;
				}

				.field-dropdown::-webkit-scrollbar-track {
					background: transparent;
				}

				.field-dropdown::-webkit-scrollbar-thumb {
					background-color: #cbd5e1;
					border-radius: 3px;
				}

				.field-dropdown::-webkit-scrollbar-thumb:hover {
					background-color: #94a3b8;
				}
				.field-dropdown-item {
					padding: 8px 2px;
					cursor: pointer;
					border-bottom: 1px solid #f3f4f6;
					transition: background-color 0.2s;
					font-size: 0.8rem;
				}

				.field-dropdown-item:hover {
					background-color: #f3f4f6;
				}

				.field-dropdown-item:last-child {
					border-bottom: none;
				}

				@media (max-width: 600px) {
					.copy-dropdown-btn {
						min-width: 180px;
						font-size: 0.9rem;
						padding: 8px 12px;
					}

					.dropdown-item {
						padding: 8px 12px;
						font-size: 0.9rem;
					}
				}

				/* Sample Section */
				.sample-section {
					border: 1px solid #e5e7eb;
					border-radius: 6px;
					padding: 0;
					margin: 15px 0;
					background-color: white;
				}
				.sample-header {
					color: #3b82f6;
					padding: 10px 15px;
					border-radius: 6px 6px 0 0;
					font-weight: 600;
					display: flex;
					justify-content: flex-start;
					align-items: center;
					gap: 10px;
				}
				.sample-content {
					padding: 10px;
				}

				/* Sample Table */
				.samples-table {
					width: 100%;
					border-collapse: collapse;
					margin: 10px 0;
					font-size: 0.85rem;
				}
				.samples-table th,
				.samples-table td {
					border: 1px solid #ddd;
					padding: 8px;
					vertical-align: top;
					text-align: left;
				}
				.samples-table th {
					background-color: #f0f0f0;
					font-weight: bold;
					text-align: center;
					font-size: 0.9rem;
				}
				.samples-table tbody tr:nth-child(even) {
					background-color: #f9f9f9;
				}

				/* Sample Info Inputs */
				.sample-info-row {
					display: flex;
					align-items: center;
					margin: 6px 0;
					gap: 8px;
				}
				.sample-info-row label {
					font-weight: 500;
					color: #374151;
					min-width: 120px;
					font-size: 0.85rem;
				}
				.sample-info-row input {
					flex: 1;
					padding: 6px 8px;
					border: 1px solid #d1d5db;
					border-radius: 3px;
					font-size: 0.85rem;
				}

				/* Analysis Parameters */
				.analysis-params {
					display: grid;
					grid-template-columns: 2fr 1fr 1fr auto;
					gap: 8px;
					align-items: center;
					margin: 6px 0;
					padding: 8px;
					border: 1px solid #e5e7eb;
					border-radius: 4px;
					background-color: white;
				}
				.analysis-params input,
				.analysis-params select {
					padding: 6px 8px;
					border: 1px solid #d1d5db;
					border-radius: 3px;
					font-size: 0.85rem;
				}

				/* Buttons */
				.btn {
					padding: 8px 16px;
					border: none;
					border-radius: 4px;
					cursor: pointer;
					font-size: 0.9rem;
					transition: background-color 0.2s;
					font-weight: 500;
				}
				.btn-primary {
					background-color: #3b82f6;
					color: white;
				}
				.btn-primary:hover {
					background-color: #2563eb;
				}
				.btn-success {
					background-color: #10b981;
					color: white;
				}
				.btn-success:hover {
					background-color: #059669;
				}
				.btn-danger {
					background-color: white;
					color: #f87171;
					border: 2px solid #f87171;
					width: 33px;
					height: 33px;
					padding: 0;
					display: flex;
					align-items: center;
					justify-content: center;
					border-radius: 6px;
					font-size: 1rem;
					font-weight: bold;
				}
				.btn-danger:hover {
					background-color: #f87171;
					color: white;
				}
				.btn-warning {
					background-color: #f59e0b;
					color: white;
				}
				.btn-warning:hover {
					background-color: #d97706;
				}

				/* Loading Animation */
				@keyframes spin {
					0% {
						transform: rotate(0deg);
					}
					100% {
						transform: rotate(360deg);
					}
				}

				/* Messages */
				.error-message,
				.success-message {
					padding: 12px;
					border-radius: 6px;
					margin: 15px 0;
					text-align: center;
				}
				.error-message {
					background-color: #fee2e2;
					border: 1px solid #fecaca;
					color: #dc2626;
				}
				.success-message {
					background-color: #d1fae5;
					border: 1px solid #a7f3d0;
					color: #065f46;
				}

				/* Submit Button */
				.submit-btn {
					background-color: #3b82f6;
					color: white;
					padding: 12px 30px;
					border: none;
					border-radius: 6px;
					cursor: pointer;
					font-size: 1rem;
					font-weight: 600;
					transition: background-color 0.2s;
					margin: 20px auto;
					display: block;
				}
				.submit-btn:hover {
					background-color: #2563eb;
				}
				.add-analysis-btn {
					display: inline-block !important;
				}

				.analysis-input-container {
					display: flex !important;
				}
				.parameters-container {
					display: block !important;
				}

				/* Media queries cho responsive design */
				/* Kiểu mặc định cho các elements (chiều rộng desktop) */
				.form-row {
					display: flex;
					align-items: center;
					margin: 8px 0;
					flex-wrap: wrap;
					gap: 10px;
				}

				.sample-info-row {
					display: flex;
					align-items: center;
					margin: 6px 0;
					gap: 8px;
				}

				.two-column {
					display: grid;
					grid-template-columns: 1fr 1fr;
					gap: 8px;
				}

				.additional-info-item,
				.analysis-item {
					display: flex;
					align-items: center;
					margin-bottom: 10px;
					gap: 8px;
				} /* Media query áp dụng khi chiều rộng trình duyệt nhỏ hơn 600px */
				@media (max-width: 599px) {
					.form-row {
						flex-direction: column;
						align-items: flex-start;
						gap: 5px;
					}

					.form-row label {
						min-width: auto;
						width: 100%;
						margin-bottom: 5px;
					}

					.form-row input,
					.form-row select,
					.form-row textarea {
						width: 100%;
						min-width: auto;
						box-sizing: border-box;
					}

					.sample-info-row {
						flex-direction: column;
						align-items: flex-start;
						gap: 5px;
					}

					.sample-info-row label {
						min-width: auto;
						width: 100%;
						margin-bottom: 5px;
					}
					.sample-info-row input,
					.sample-info-row textarea {
						width: 100%;
						box-sizing: border-box;
						font-family: Arial, sans-serif;
						font-size: 14px;
						line-height: 1.4;
					}

					.two-column {
						grid-template-columns: 1fr;
						gap: 10px;
					}

					/* Giữ additional-info-item và analysis-item trên 1 hàng */
					.additional-info-item,
					.analysis-item {
						display: flex;
						align-items: center;
						flex-wrap: nowrap;
						gap: 5px;
					}

					.field-label-container {
						flex-shrink: 0;
						width: auto;
						min-width: 80px;
					}
					.additional-info-input,
					.parameter-name-input,
					.parameter-price-input {
						flex: 1;
						min-width: 0;
						box-sizing: border-box;
					}

					.remove-btn {
						flex-shrink: 0;
						width: 30px;
						height: 30px;
						min-width: 30px;
					}

					/* Giữ sample-header trên 1 hàng */
					.sample-header {
						display: flex;
						align-items: center;
						flex-wrap: nowrap;
						gap: 8px;
					}

					.sample-header span {
						flex-shrink: 0;
						white-space: nowrap;
						font-size: 0.9rem;
					}

					.sample-header input {
						flex: 1;
						min-width: 0;
						margin: 0;
						box-sizing: border-box;
					}
					.sample-header button {
						flex-shrink: 0;
						width: 33px;
						height: 33px;
					} /* Responsive cho full-width address */
					.full-width-address,
					.full-width-description {
						grid-column: auto;
					}
					margin: 0;
					box-sizing: border-box;
				}

				.sample-header button {
					align-self: flex-end;
				}

				.info-field-select {
					width: 100%;
				}

				.custom-field-container {
					width: 100%;
				}
				.custom-field-name {
					width: 100%;
				} /* Responsive cho phần Additional info và Analysis parameters */
				.additional-analysis-container {
					flex-direction: column;
					gap: 15px;
				}
				.additional-info-box,
				.analysis-parameters-box {
					flex: none;
					width: 100%;
					box-sizing: border-box;
				}
			} /* Media query cho màn hình >= 600px để đảm bảo layout ngang */
			@media (min-width: 600px) {
				.additional-analysis-container {
					display: flex !important;
					flex-direction: row !important;
					gap: 15px !important;
				}

				.additional-info-box {
					flex: 0.5 !important;
					width: auto !important;
				}

				.analysis-parameters-box {
					flex: 0.5 !important;
					width: auto !important;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>Phiếu Gửi Mẫu Thử Nghiệm</h1>

			<!-- Loading indicator -->
			<div id="loadingIndicator" style="display: none; text-align: center; padding: 2rem">
				<div
					style="
						border: 4px solid #f3f4f6;
						border-top: 4px solid #3b82f6;
						border-radius: 50%;
						width: 40px;
						height: 40px;
						animation: spin 1s linear infinite;
						margin: 0 auto;
					"
				></div>
				<p style="margin-top: 1rem; color: #6b7280">Đang tải thông tin...</p>
			</div>
			<div id="formContent">
				<!-- 1. Thông tin khách hàng -->
				<div class="info-card">
					<h3>🏢 Thông tin khách hàng</h3>
					<div class="two-column">
						<div>
							<div class="form-row">
								<label>Tên cá nhân / tổ chức:</label>
								<input type="text" id="clientName" placeholder="Nhập tên cá nhân / tổ chức" required />
							</div>
							<div class="form-row">
								<label>Mã số thuế / CCCD:</label>
								<input type="text" id="legalId" placeholder="Nhập mã số thuế / CCCD" required />
							</div>
						</div>

						<div>
							<div class="form-row">
								<label>Số điện thoại:</label>
								<input type="tel" id="clientPhone" placeholder="Số điện thoại liên hệ" />
							</div>
							<div class="form-row">
								<label>Email nhận hóa đơn:</label>
								<input type="email" id="invoiceEmail" placeholder="Email nhận hóa đơn" />
							</div>
						</div>
					</div>
					<div class="form-row full-width-address" style="margin-top: 15px">
						<label>Địa chỉ:</label>
						<input type="text" id="clientAddress" placeholder="Nhập địa chỉ" required />
					</div>
					<div style="margin-top: 15px">
						<label style="display: block; font-weight: 600; color: #374151; margin-bottom: 8px; font-size: 0.9rem"
							>Thông tin xuất hóa đơn (nếu khác thông tin trên):</label
						>
						<textarea
							id="invoiceInfo"
							placeholder="Nhập thông tin xuất hóa đơn nếu khác với thông tin khách hàng ở trên"
							rows="3"
							style="
								width: 100%;
								max-width: 100%;
								padding: 8px 12px;
								border: 1px solid #d1d5db;
								border-radius: 4px;
								font-family: Arial, sans-serif;
								font-size: 14px;
								line-height: 1.4;
								transition: border-color 0.2s, box-shadow 0.2s;
								box-sizing: border-box;
								resize: vertical;
							"
						></textarea>
					</div>
				</div>
				<!-- 2. Thông tin liên hệ -->
				<div class="info-card">
					<h3>👤 Thông tin liên hệ</h3>
					<div class="two-column">
						<div>
							<div class="form-row">
								<label>Tên người liên hệ:</label>
								<input type="text" id="contactName" placeholder="Nhập tên người liên hệ" required />
							</div>
							<div class="form-row">
								<label>Số điện thoại:</label>
								<input type="tel" id="contactPhone" placeholder="Nhập số điện thoại" required />
							</div>
							<div class="form-row">

								<label>Người nhận (nếu khác trên):</label>

						</div>

							<div class="form-row">
								<label>Email:</label>
								<input type="email" id="receiverEmail" placeholder="Email nhận kết quả" />

								<label>Phương thức khác:</label>

							onclick="addSample()"
							style="padding: 10px 20px; font-size: 1rem"
						>
							+ Thêm mẫu mới
						</button>
						<span style="color: #6b7280">hoặc</span>
						<div style="position: relative">
							<button type="button" id="copyFromSampleBtn" onclick="toggleCopyDropdown()" class="copy-dropdown-btn">
								<span>Sao chép từ mẫu có sẵn</span>
								<span style="margin-left: 10px">▼</span>
							</button>

								<!-- Dropdown items will be added here -->
							</div>

		<style>
			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}
		</style>

		<script>
			let sampleCount = 0;
			let crmData = null;

			// Function to get URL parameters
			function getUrlParameter(name) {
				name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
				const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
				const results = regex.exec(location.search);
				return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
			}

			// Helper function to handle null/undefined values
			function safeValue(value) {
				if (value === null || value === undefined || value === 'null' || value === 'undefined') {
					return '';
				}
				return String(value);
			}

			// Function to load data from CRM API
			async function loadCRMData(code) {
				if (!code) return;

				const loadingIndicator = document.getElementById('loadingIndicator');
				const formContent = document.getElementById('formContent');

				// Show loading
				loadingIndicator.style.display = 'block';
				formContent.style.display = 'none';

				try {
					const response = await fetch('https://black.irdop.org/crm/generate_receipt', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
						},
						body: JSON.stringify({ code: code.toUpperCase() }),
					});

					const data = await response.json();

					if (data.error) {
						throw new Error(data.message || 'Không thể tải dữ liệu từ CRM');
					}

					crmData = data;
					populateFormWithCRMData(data);
				} catch (error) {
					console.error('Error loading CRM data:', error);
					showErrorMessage('Không thể tải dữ liệu: ' + error.message);
				} finally {
					// Hide loading
					loadingIndicator.style.display = 'none';
					formContent.style.display = 'block';
				}
			} // Function to populate form with CRM data
			function populateFormWithCRMData(data) {
				try {
					// Populate client information
					if (data.client) {
						document.getElementById('clientName').value = safeValue(data.client.client_name);
						document.getElementById('clientAddress').value = safeValue(data.client.client_address);
						document.getElementById('legalId').value = safeValue(data.client.legal_id);
						document.getElementById('clientPhone').value = safeValue(data.client.client_phone);
						document.getElementById('invoiceEmail').value = safeValue(data.client.invoice_email);
						document.getElementById('invoiceInfo').value = safeValue(data.client.invoice_info);
					} // Populate contact information
					if (data.contact) {
						document.getElementById('contactName').value = safeValue(data.contact.name);
						document.getElementById('contactPhone').value = safeValue(data.contact.phone);
						document.getElementById('contactEmail').value = safeValue(data.contact.email);
						document.getElementById('contactId').value = safeValue(data.contact.id);
						document.getElementById('contactIdDate').value = safeValue(data.contact.id_date);
						document.getElementById('contactIdPlace').value = safeValue(data.contact.id_place);
					} // Populate receiver information
					if (data.receiver) {
						document.getElementById('receiverAddress').value = safeValue(data.receiver.address);
						document.getElementById('receiverName').value = safeValue(data.receiver.name);
						document.getElementById('receiverEmail').value = safeValue(data.receiver.email);
						document.getElementById('receiverOther').value = safeValue(data.receiver.other);
					}

					// Populate samples
					if (data.samples && data.samples.length > 0) {
						// Clear existing samples
						const samplesContainer = document.getElementById('samples-container');
						samplesContainer.innerHTML = '';
						sampleCount = 0;

						data.samples.forEach((sample, index) => {
							addSampleWithData(sample, index);
						});
					}

					showSuccessMessage('Đã tải thông tin thành công từ CRM!');
				} catch (error) {
					console.error('Error populating form:', error);
					showErrorMessage('Có lỗi khi điền thông tin vào form');
				}
			}

			// Function to add sample with CRM data
			function addSampleWithData(sampleData, index) {
				const container = document.getElementById('samples-container');
				const newSample = document.createElement('div');
				newSample.className = 'sample-section';
				newSample.setAttribute('data-sample-index', index);

				newSample.innerHTML = createSampleHTML(index + 1);
				container.appendChild(newSample); // Populate sample data
				const sampleSection = newSample;
				sampleSection.querySelector('.sample-name').value = safeValue(sampleData.sample_name);
				sampleSection.querySelector('.sample-description').value = safeValue(sampleData.sample_description);
				sampleSection.querySelector('.sample-matrix').value = safeValue(sampleData.matrix);
				sampleSection.querySelector('.sample-volume').value = safeValue(sampleData.volume);

				// Populate additional info
				const additionalInfoContainer = sampleSection.querySelector('.additional-info-container');

				// Clear default fields first
				additionalInfoContainer.innerHTML = '';
				// Clear default fields first
				additionalInfoContainer.innerHTML = ''; // Handle sample_information format with fname and fvalue (priority)
				if (sampleData.sample_information && sampleData.sample_information.length > 0) {
					// Check if "Tên mẫu thử / name." already exists in API data
					const hasNameField = sampleData.sample_information.some((info) => info.fname === 'Tên mẫu thử / name.');
					// If not present, add it first as hidden
					if (!hasNameField) {
						addAdditionalInfoItem(
							additionalInfoContainer,
							'Tên mẫu thử / name.',
							safeValue(sampleData.sample_name),
							'sample_test_name',
							true,
						);
					}

					sampleData.sample_information.forEach((info) => {
						// Hide "Tên mẫu thử / name." field if it exists in API data
						const isNameField = info.fname === 'Tên mẫu thử / name.';
						addAdditionalInfoItem(
							additionalInfoContainer,
							safeValue(info.fname),
							safeValue(info.fvalue),
							safeValue(info.fname),
							isNameField,
						);
					});
				} // Fallback to additional_info format if available
				else if (sampleData.additional_info && sampleData.additional_info.length > 0) {
					// Add hidden "Tên mẫu thử / name." field first if not already present
					const hasNameField = sampleData.additional_info.some((info) => info.label === 'Tên mẫu thử / name.');
					if (!hasNameField) {
						addAdditionalInfoItem(
							additionalInfoContainer,
							'Tên mẫu thử / name.',
							safeValue(sampleData.sample_name),
							'sample_test_name',
							true,
						);
					}

					// If already in the correct format with label and field
					sampleData.additional_info.forEach((info) => {
						const isNameField = info.label === 'Tên mẫu thử / name.';
						addAdditionalInfoItem(
							additionalInfoContainer,
							safeValue(info.label),
							safeValue(info.value),
							safeValue(info.field),
							isNameField,
						);
					});
				}
				// If no additional info found, add default fields
				else {
					// Add hidden "Tên mẫu thử / name." field first
					addAdditionalInfoItem(
						additionalInfoContainer,
						'Tên mẫu thử / name.',
						safeValue(sampleData.sample_name),
						'sample_test_name',
						true,
					); // Add default fields
					addAdditionalInfoItem(additionalInfoContainer, 'Số lô / LOT no.', '', 'lot_number');
					addAdditionalInfoItem(additionalInfoContainer, 'Ngày sản xuất / mfg.', '', 'manufacturing_date');
					addAdditionalInfoItem(additionalInfoContainer, 'Hạn sử dụng / exp.', '', 'expiry_date');
					addAdditionalInfoItem(additionalInfoContainer, 'Nơi sản xuất / mfr.', '', 'manufacturer');
				}

				// If analysis data exists, handle it
				if (sampleData.analysis && sampleData.analysis.length > 0) {
					const analysisContainer = sampleSection.querySelector('.analysis-container');

					// If analysis container exists, populate it
					if (analysisContainer) {
						// Clear existing rows
						analysisContainer.innerHTML = ''; // Add each analysis parameter
						sampleData.analysis.forEach((analysis) => {
							const newItem = document.createElement('div');
							newItem.className = 'analysis-item';
							newItem.innerHTML = `
								<input type="text" class="parameter-name-input" value="${safeValue(
									analysis.parameter_name,
								)}" placeholder="Tên chỉ tiêu" style="flex: 1; padding: 6px 2px; border: 1px solid #d1d5db; border-radius: 4px; min-width: 0; background-color: white;">
								<input type="text" class="parameter-price-input" value="${safeValue(
									analysis.price || '',
								)}" placeholder="Giá" readonly style="width: 80px; padding: 6px 2px; border: 1px solid #d1d5db; border-radius: 4px; background-color: #f3f4f6; cursor: not-allowed;">
								<button type="button" class="remove-btn" onclick="removeAnalysisRow(this)" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">×</button>
							`;
							analysisContainer.appendChild(newItem);
						});
					}
				}
				sampleCount++;

				// Ensure the hidden "Tên mẫu thử / name." field is synced with sample_name
				const hiddenNameField = Array.from(sampleSection.querySelectorAll('.additional-info-item')).find((item) => {
					const select = item.querySelector('.info-field-select');
					return select && select.value === 'Tên mẫu thử / name.';
				});
				if (hiddenNameField) {
					const hiddenInput = hiddenNameField.querySelector('.additional-info-input');
					if (hiddenInput) {
						hiddenInput.value = safeValue(sampleData.sample_name);
					}
				}

				// Check auth cookie for newly added sample
				checkAuthCookieAndUpdateUI();
			} // Helper function to add additional info items
			function addAdditionalInfoItem(container, label, value, field, hidden = false) {
				// Define common field options similar to CreateReceiptFromCRM.jsx
				const commonFields = [
					'Tên mẫu thử / name.',
					'Số lô / LOT no.',
					'Ngày sản xuất / mfg.',
					'Hạn sử dụng / exp.',
					'Nơi sản xuất / mfr.',
					'Số công bố / pub. no.',
					'Số đăng ký / reg. no.',
				];
				const infoItem = document.createElement('div');
				infoItem.className = 'additional-info-item';
				// Hide the item if hidden parameter is true
				if (hidden) {
					infoItem.style.display = 'none';
				} // Create the HTML with editable field name and value in same container
				infoItem.innerHTML = `
					<div style="position: relative; display: inline-block;">
						<input type="text" class="editable-field-input" value="${safeValue(label)}" placeholder="Tên trường" />
						<div class="field-dropdown">
							${commonFields.map((field) => `<div class="field-dropdown-item" data-value="${field}">${field}</div>`).join('')}
						</div>
					</div>
					<input type="text" class="additional-info-input" data-field="${safeValue(field) || 'custom'}" value="${safeValue(
					value,
				)}" placeholder="Nhập giá trị" style="flex: 1; padding: 6px 8px; border: none; background-color: white;" />
					<button type="button" class="remove-btn" onclick="removeAdditionalInfo(this)" style="background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 4px; opacity: 0.7;">×</button>
				`;

				container.appendChild(infoItem);

				// Setup event listeners for the editable field
				setupEditableField(infoItem);

				// If this is the hidden name field, sync it with sample name
				if (hidden && label === 'Tên mẫu thử / name.') {
					const sampleSection = container.closest('.sample-section');
					if (sampleSection) {
						syncSampleNameWithHiddenField(sampleSection);
					}
				}
			} // Function to setup editable field with dropdown
			function setupEditableField(infoItem) {
				const input = infoItem.querySelector('.editable-field-input');
				const dropdown = infoItem.querySelector('.field-dropdown');
				const dropdownItems = dropdown.querySelectorAll('.field-dropdown-item'); // Click on input to show dropdown or enable editing
				input.addEventListener('click', function (e) {
					e.stopPropagation();
					// Show dropdown
					dropdown.style.display = 'block';
					dropdown.style.position = 'absolute';
					dropdown.style.top = '100%';
					dropdown.style.left = '0';
					dropdown.style.width = '140px';
				});

				// Handle dropdown item selection
				dropdownItems.forEach((item) => {
					item.addEventListener('click', function (e) {
						e.stopPropagation();
						const value = this.getAttribute('data-value');

						// Set selected value
						input.value = value;
						dropdown.style.display = 'none';

						// Update dropdown to reflect changes
						updateCopyFromDropdown();
					});
				});

				// Handle input blur
				input.addEventListener('blur', function () {
					setTimeout(() => {
						dropdown.style.display = 'none';

						// If input is empty, set a default value
						if (!input.value.trim()) {
							input.value = 'Tên trường';
						}

						updateCopyFromDropdown();
					}, 200);
				});

				// Handle input changes
				input.addEventListener('input', function () {
					updateCopyFromDropdown();
				});

				// Handle keyboard events
				input.addEventListener('keydown', function (e) {
					if (e.key === 'Enter') {
						dropdown.style.display = 'none';
						input.blur();
					} else if (e.key === 'Escape') {
						dropdown.style.display = 'none';
						input.blur();
					}
				});

				// Set initial state - allow editing by default
				input.readOnly = false;
				input.style.backgroundColor = '#f9f9f9';
			}

			// Function to create sample HTML template
			function createSampleHTML(sampleNumber) {
				return `
					<div class="sample-header">
						<span>${sampleNumber}. Tên mẫu:</span>
						<input type="text" class="sample-name" placeholder="Nhập tên mẫu" required style="flex: 1; margin: 0 10px; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 4px;" />
						<button type="button" class="btn btn-danger" onclick="removeSample(this)" title="Xóa mẫu">×</button>
					</div>					<div class="sample-content">
						<!-- Basic Sample Info -->
						<div class="two-column" style="margin-bottom: 15px;">
							<div class="sample-info-row">
								<label>Nền mẫu:</label>
								<input type="text" class="sample-matrix" placeholder="Nền mẫu" />
							</div>							<div class="sample-info-row">
								<label>Số lượng:</label>
								<input type="text" class="sample-volume" placeholder="Số lượng mẫu" />
							</div>
							<div class="sample-info-row full-width-description">
								<label>Mô tả mẫu:</label>
								<textarea class="sample-description" placeholder="Mô tả chi tiết mẫu" rows="2" style="width: 100%; font-family: Arial, sans-serif; font-size: 14px; line-height: 1.4;"></textarea>
							</div>
						</div><!-- Two-column layout for Additional info and Analysis parameters -->
						<div class="additional-analysis-container">
							<!-- Additional Sample Info Box (60%) -->
							<div class="additional-info-box">
								<h4 style="margin: 0 0 15px 0; color: #374151; font-size: 0.95rem;">📋 Thông tin thêm</h4>
								<div class="additional-info-container">
									<!-- Sample info items will be added here dynamically -->
								</div>
								<button type="button" class="btn btn-success" onclick="addAdditionalInfo(this)" style="margin-top: 10px; background-color: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem;">+ Thêm thông tin</button>
							</div>
									<!-- Analysis Parameters Box (40%) -->
							<div class="analysis-parameters-box">
								<h4 style="margin: 0 0 15px 0; color: #374151; font-size: 0.95rem;">🔬 Danh sách chỉ tiêu</h4>
								
								<!-- Column headers -->
								<div class="analysis-header" style="display: flex; align-items: center; gap: 5px; margin-bottom: 8px; font-size: 0.85rem; color: #6b7280; font-weight: 500;">
									<div style="flex: 1; padding-left: 2px;">Tên chỉ tiêu</div>
									<div style="width: 80px; padding-left: 2px;">Giá</div>
									<div style="width: 30px; text-align: center;">Xóa</div>
								</div>
								
								<div class="analysis-container">
									<!-- Analysis items will be added here -->
								</div>
                                <div style="margin-top: 10px; display: flex; gap: 10px;" class="analysis-input-container">
									<input type="text" class="new-parameter-input" placeholder="Nhập tên chỉ tiêu" style="flex: 1; padding: 6px 2px; border: 1px solid #d1d5db; border-radius: 4px;">
									<button type="button" class="btn btn-success add-analysis-btn" onclick="addAnalysisParameter(this)" style="background-color: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem;">+ Thêm</button>
								</div>
							</div>
						</div>
					</div>
				`;
			}

			// Show error message
			function showErrorMessage(message) {
				const existingErrors = document.querySelectorAll('.error-message');
				existingErrors.forEach((error) => error.remove());

				const errorContainer = document.createElement('div');
				errorContainer.className = 'error-message';
				errorContainer.style.cssText =
					'background-color: #fee2e2; border: 1px solid #fecaca; color: #dc2626; padding: 1rem; border-radius: 0.25rem; margin-bottom: 1rem; text-align: center;';
				errorContainer.textContent = message;

				const container = document.querySelector('.container');
				const title = container.querySelector('h1');
				title.insertAdjacentElement('afterend', errorContainer);
			}

			// Show success message
			function showSuccessMessage(message) {
				const successMessage = document.createElement('div');
				successMessage.className = 'success-message';
				successMessage.style.cssText =
					'background-color: #d1fae5; border: 1px solid #a7f3d0; color: #065f46; padding: 1rem; border-radius: 0.25rem; margin-bottom: 1rem; text-align: center;';
				successMessage.textContent = message;

				const container = document.querySelector('.container');
				const title = container.querySelector('h1');
				title.insertAdjacentElement('afterend', successMessage); // Auto remove after 3 seconds
				setTimeout(() => {
					successMessage.remove();
				}, 3000);
			}

			// Initialize page
			document.addEventListener('DOMContentLoaded', function () {
				const code = getUrlParameter('code');
				if (code) {
					loadCRMData(code);
				} else {
					// No code parameter, show empty form
					document.getElementById('formContent').style.display = 'block'; // Add first sample
					addSample();
				}

				// Initialize dropdown state
				setTimeout(updateCopyFromDropdown, 200);
				// Add event listener to update dropdown when sample data changes
				document.addEventListener('input', function (e) {
					if (e.target.classList.contains('sample-name')) {
						// Update the hidden "Tên mẫu thử / name." field when sample name changes
						const sampleSection = e.target.closest('.sample-section');
						if (sampleSection) {
							const hiddenNameField = Array.from(sampleSection.querySelectorAll('.additional-info-item')).find(
								(item) => {
									const select = item.querySelector('.info-field-select');
									return select && select.value === 'Tên mẫu thử / name.';
								},
							);
							if (hiddenNameField) {
								const hiddenInput = hiddenNameField.querySelector('.additional-info-input');
								if (hiddenInput) {
									hiddenInput.value = e.target.value;
								}
							}
						}
						setTimeout(updateCopyFromDropdown, 100); // Delay to ensure value is updated
					} else if (
						e.target.classList.contains('sample-description') ||
						e.target.classList.contains('sample-matrix') ||
						e.target.classList.contains('sample-volume') ||
						e.target.classList.contains('additional-info-input') ||
						e.target.classList.contains('parameter-name-input') ||
						e.target.classList.contains('parameter-price-input')
					) {
						setTimeout(updateCopyFromDropdown, 100); // Delay to ensure value is updated
					}
				});

				// Also update when dropdowns change
				document.addEventListener('change', function (e) {
					if (e.target.classList.contains('info-field-select')) {
						setTimeout(updateCopyFromDropdown, 100);
					}
				});
			});

			// Function to add a new sample section
			function addSample() {
				const container = document.getElementById('samples-container');
				const newSample = document.createElement('div');
				newSample.className = 'sample-section';
				newSample.setAttribute('data-sample-index', sampleCount);

				newSample.innerHTML = createSampleHTML(sampleCount + 1);
				container.appendChild(newSample);
				sampleCount++; // Add default additional info fields to the new sample
				const additionalInfoContainer = newSample.querySelector('.additional-info-container');
				if (additionalInfoContainer) {
					// Add hidden "Tên mẫu thử / name." field (will be populated from sample name input)
					addAdditionalInfoItem(additionalInfoContainer, 'Tên mẫu thử / name.', '', 'sample_test_name', true);
					addAdditionalInfoItem(additionalInfoContainer, 'Số lô / LOT no.', '', 'lot_number');
					addAdditionalInfoItem(additionalInfoContainer, 'Ngày sản xuất / mfg.', '', 'manufacturing_date');
					addAdditionalInfoItem(additionalInfoContainer, 'Hạn sử dụng / exp.', '', 'expiry_date');
					addAdditionalInfoItem(additionalInfoContainer, 'Nơi sản xuất / mfr.', '', 'manufacturer');
				}

				// Check auth cookie for newly added sample
				checkAuthCookieAndUpdateUI();

				// Update dropdown options (will only show samples with data)
				setTimeout(updateCopyFromDropdown, 100);
			} // Function to update dropdown with existing samples
			function updateCopyFromDropdown() {
				const button = document.getElementById('copyFromSampleBtn');
				const dropdown = document.getElementById('copyFromDropdown');
				const samples = document.querySelectorAll('.sample-section');

				// Clear existing dropdown items
				dropdown.innerHTML = '';

				let validSamples = [];

				// Include all samples, even those without names
				samples.forEach((sample, index) => {
					const sampleName = sample.querySelector('.sample-name').value;
					const displayName =
						sampleName && sampleName.trim() ? `${index + 1}. ${sampleName.trim()}` : `${index + 1}. Mẫu ${index + 1}`;

					validSamples.push({
						index: index,
						name: sampleName && sampleName.trim() ? sampleName.trim() : `Mẫu ${index + 1}`,
						displayName: displayName,
					});
				});

				// Add valid samples to dropdown
				if (validSamples.length > 0) {
					validSamples.forEach((validSample) => {
						const item = document.createElement('div');
						item.className = 'dropdown-item';
						item.textContent = validSample.displayName;
						item.onclick = () => {
							copyFromExistingSample(validSample.index);
							// Close dropdown after selection
							const dropdown = document.getElementById('copyFromDropdown');
							const button = document.getElementById('copyFromSampleBtn');
							dropdown.style.display = 'none';
							button.querySelector('span:last-child').textContent = '▼';
						};
						dropdown.appendChild(item);
					});
				} else {
					// Show empty message
					const emptyItem = document.createElement('div');
					emptyItem.className = 'dropdown-empty';
					emptyItem.textContent = 'Chưa có mẫu nào để sao chép';
					dropdown.appendChild(emptyItem);
				}

				// Show button if there are any samples (even without names)
				const buttonContainer = button.parentElement;
				if (samples.length === 0) {
					buttonContainer.style.display = 'none';
				} else {
					buttonContainer.style.display = 'block';
				}
			} // Function to toggle dropdown visibility
			function toggleCopyDropdown() {
				const dropdown = document.getElementById('copyFromDropdown');
				const button = document.getElementById('copyFromSampleBtn');

				if (dropdown.style.display === 'none' || !dropdown.style.display) {
					dropdown.style.display = 'block';
					button.querySelector('span:last-child').textContent = '▲';
				} else {
					dropdown.style.display = 'none';
					button.querySelector('span:last-child').textContent = '▼';
				}
			}

			// Close field dropdown when clicking outside
			document.addEventListener('click', function (e) {
				const dropdowns = document.querySelectorAll('.field-dropdown');
				dropdowns.forEach((dropdown) => {
					const container = dropdown.closest('div[style*="position: relative"]');
					if (container && !container.contains(e.target)) {
						dropdown.style.display = 'none';
					}
				});
			});

			// Function to close dropdown when clicking outside
			document.addEventListener('click', function (event) {
				const button = document.getElementById('copyFromSampleBtn');
				const dropdown = document.getElementById('copyFromDropdown');

				if (button && dropdown && !button.contains(event.target) && !dropdown.contains(event.target)) {
					dropdown.style.display = 'none';
					button.querySelector('span:last-child').textContent = '▼';
				}
			}); // Function to copy from existing sample
			function copyFromExistingSample(sourceIndex) {
				if (sourceIndex === '') return;

				const samples = document.querySelectorAll('.sample-section');
				const sourceSample = samples[sourceIndex];
				if (!sourceSample) return; // Get all data from source sample
				const sampleData = {
					sample_name: safeValue(sourceSample.querySelector('.sample-name').value),
					sample_description: safeValue(sourceSample.querySelector('.sample-description').value),
					matrix: safeValue(sourceSample.querySelector('.sample-matrix').value),
					volume: safeValue(sourceSample.querySelector('.sample-volume').value),
					sample_information: [], // Use sample_information format for addSampleWithData
					analysis: [],
				}; // Get additional info (skip hidden "Tên mẫu thử / name." field)
				const additionalInfoItems = sourceSample.querySelectorAll('.additional-info-item');
				additionalInfoItems.forEach((item) => {
					const editableInput = item.querySelector('.editable-field-input');
					const valueInput = item.querySelector('.additional-info-input');
					let fname = '';
					if (editableInput) {
						fname = editableInput.value.trim() || 'Tên trường';
					} else {
						// Fallback to old structure for backward compatibility
						const selectField = item.querySelector('.info-field-select');
						const customInput = item.querySelector('.custom-field-name');

						if (selectField) {
							if (selectField.value === 'Thông tin khác') {
								fname = customInput && customInput.value.trim() ? customInput.value.trim() : 'Tên trường';
							} else {
								fname = selectField.value;
							}
						} else {
							fname = 'Tên trường';
						}
					}

					// Skip hidden "Tên mẫu thử / name." field as it will be auto-generated
					if (valueInput && valueInput.value.trim() && fname !== 'Tên mẫu thử / name.') {
						sampleData.sample_information.push({
							fname: fname,
							fvalue: valueInput.value.trim(),
						});
					}
				}); // Get analysis parameters
				const analysisItems = sourceSample.querySelectorAll('.analysis-item');
				analysisItems.forEach((item) => {
					const parameterInput = item.querySelector('.parameter-name-input');
					const priceInput = item.querySelector('.parameter-price-input');
					if (parameterInput && parameterInput.value.trim()) {
						sampleData.analysis.push({
							parameter_name: parameterInput.value.trim(),
							price: priceInput && priceInput.value.trim() ? priceInput.value.trim() : '',
						});
					}
				});

				// Create new sample with copied data using the existing function
				addSampleWithData(sampleData, sampleCount);

				// Reset dropdown selection
				document.getElementById('copyFromSampleSelect').value = '';
			} // Function to remove a sample
			function removeSample(button) {
				const sampleSection = button.closest('.sample-section');
				const samplesContainer = document.getElementById('samples-container');

				if (samplesContainer.children.length > 1) {
					sampleSection.remove();
					updateSampleNumbers();
					updateCopyFromDropdown();
				} else {
					alert('Phải có ít nhất một mẫu!');
				}
			} // Function to update sample numbers after removal
			function updateSampleNumbers() {
				const samples = document.querySelectorAll('.sample-section');
				samples.forEach((sample, index) => {
					const header = sample.querySelector('.sample-header span');
					if (header) {
						header.textContent = `${index + 1}. Tên mẫu:`;
					}
					sample.setAttribute('data-sample-index', index);
				});
				sampleCount = samples.length;
				updateCopyFromDropdown();
			}

			// Function to collect form data
			function collectFormData() {
				const formData = {
					// Client information
					client: {
						client_name: document.getElementById('clientName').value.trim(),
						client_address: document.getElementById('clientAddress').value.trim(),
						legal_id: document.getElementById('legalId').value.trim(),
						client_phone: document.getElementById('clientPhone').value.trim(),
						invoice_email: document.getElementById('invoiceEmail').value.trim(),
						invoice_info: document.getElementById('invoiceInfo').value.trim(),
					}, // Contact information
					contact: {
						name: document.getElementById('contactName').value.trim(),
						phone: document.getElementById('contactPhone').value.trim(),
						email: document.getElementById('contactEmail').value.trim(),
						id: document.getElementById('contactId').value.trim(),
						id_date: document.getElementById('contactIdDate').value,
						id_place: document.getElementById('contactIdPlace').value.trim(),
					}, // Receiver information
					receiver: {
						address: document.getElementById('receiverAddress').value.trim(),
						name: document.getElementById('receiverName').value.trim(),
						email: document.getElementById('receiverEmail').value.trim(),
						other: document.getElementById('receiverOther').value.trim(),
					},

					// Samples
					samples: [],
				}; // Collect sample data
				const sampleSections = document.querySelectorAll('.sample-section');
				sampleSections.forEach((section, index) => {
					const sampleData = {
						sample_name: section.querySelector('.sample-name').value.trim(),
						sample_description: section.querySelector('.sample-description').value.trim(),
						matrix: section.querySelector('.sample-matrix').value.trim(),
						volume: section.querySelector('.sample-volume').value.trim(),
						additional_info: [],
						sample_information: [], // Add compatibility with CRM API format
						analysis: [], // For analysis parameters
					}; // Collect additional info
					const additionalInfoItems = section.querySelectorAll('.additional-info-item');

					// Always add "Tên mẫu thử / name." as the first item in sample_information
					sampleData.sample_information.push({
						fname: 'Tên mẫu thử / name.',
						fvalue: sampleData.sample_name || '',
					});
					additionalInfoItems.forEach((item) => {
						let fname, fvalue; // Get field name from the editable input
						const editableInput = item.querySelector('.editable-field-input');
						if (editableInput) {
							fname = editableInput.value.trim() || 'Tên trường';
						} else {
							// Fallback to select if editable input doesn't exist (backward compatibility)
							const selectField = item.querySelector('.info-field-select');
							if (selectField) {
								// If it's "Thông tin khác", get the field name from the custom input
								if (selectField.value === 'Thông tin khác') {
									const customInput = item.querySelector('.custom-field-name');
									fname = customInput && customInput.value.trim() ? customInput.value.trim() : 'Tên trường';
								} else {
									fname = selectField.value;
								}
							} else {
								const labelElement = item.querySelector('label');
								fname = labelElement ? labelElement.textContent.trim() : 'Tên trường';
							}
						}

						const input = item.querySelector('.additional-info-input');
						if (input) {
							fvalue = input.value.trim();
							const field = input.getAttribute('data-field') || 'custom';

							// Skip "Tên mẫu thử / name." since we already added it above
							if (fvalue && fname !== 'Tên mẫu thử / name.') {
								// Add to both formats for compatibility
								sampleData.additional_info.push({
									field: field,
									label: fname,
									value: fvalue,
								});

								// Add in fname/fvalue format for CRM API
								sampleData.sample_information.push({
									fname: fname,
									fvalue: fvalue,
								});
							}
						}
					}); // Collect analysis parameters
					const analysisItems = section.querySelectorAll('.analysis-item');
					analysisItems.forEach((item) => {
						const parameterName = item.querySelector('.parameter-name-input').value.trim();
						const parameterPrice = item.querySelector('.parameter-price-input').value.trim();
						if (parameterName) {
							sampleData.analysis.push({
								parameter_name: parameterName,
								price: parameterPrice || '',
							});
						}
					});

					formData.samples.push(sampleData);
				});

				return formData;
			} // Function to validate form
			function validateForm(formData) {
				const errors = [];

				// Required fields validation
				if (!formData.client.client_name) errors.push('Tên khách hàng là bắt buộc');
				if (!formData.client.client_address) errors.push('Địa chỉ khách hàng là bắt buộc');
				if (!formData.client.legal_id) errors.push('Mã số thuế/CCCD là bắt buộc');
				if (!formData.contact.name) errors.push('Tên người liên hệ là bắt buộc');
				if (!formData.contact.phone) errors.push('Số điện thoại liên hệ là bắt buộc');
				if (!formData.contact.email) errors.push('Email liên hệ là bắt buộc');

				// Email validation
				const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
				if (formData.contact.email && !emailRegex.test(formData.contact.email)) {
					errors.push('Email liên hệ không hợp lệ');
				}
				if (formData.client.invoice_email && !emailRegex.test(formData.client.invoice_email)) {
					errors.push('Email hóa đơn không hợp lệ');
				}
				if (formData.receiver.email && !emailRegex.test(formData.receiver.email)) {
					errors.push('Email nhận kết quả không hợp lệ');
				}

				// Sample validation
				if (formData.samples.length === 0) {
					errors.push('Phải có ít nhất một mẫu');
				} else {
					formData.samples.forEach((sample, index) => {
						if (!sample.sample_name) {
							errors.push(`Mẫu ${index + 1}: Tên mẫu là bắt buộc`);
						}
					});
				}

				return errors;
			}

			// Function to display errors
			function displayErrors(errors) {
				// Remove existing error messages
				const existingErrors = document.querySelectorAll('.error-message');
				existingErrors.forEach((error) => error.remove());

				if (errors.length > 0) {
					const errorContainer = document.createElement('div');
					errorContainer.className = 'error-message';
					errorContainer.style.cssText =
						'background-color: #fee2e2; border: 1px solid #fecaca; color: #dc2626; padding: 1rem; border-radius: 0.25rem; margin-bottom: 1rem;';

					const errorList = document.createElement('ul');
					errorList.style.cssText = 'margin: 0; padding-left: 1.5rem;';

					errors.forEach((error) => {
						const listItem = document.createElement('li');
						listItem.textContent = error;
						errorList.appendChild(listItem);
					});

					errorContainer.appendChild(errorList);

					const container = document.querySelector('.container');
					const title = container.querySelector('h1');
					title.insertAdjacentElement('afterend', errorContainer);

					// Scroll to errors
					errorContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
					return false;
				}
				return true;
			}

			// Main submit function
			function submitForm() {
				const formData = collectFormData();
				const errors = validateForm(formData);
				if (!displayErrors(errors)) {
					return;
				}

				// Show loading state
				const submitButton = document.querySelector('.submit-btn');
				const originalText = submitButton.textContent;
				submitButton.textContent = 'Đang gửi...';
				submitButton.disabled = true;

				// Here you would normally send the data to your server
				console.log('Form Data:', formData);

				// Simulate API call
				setTimeout(() => {
					// Show success message
					const successMessage = document.createElement('div');
					successMessage.className = 'success-message';
					successMessage.style.cssText =
						'background-color: #d1fae5; border: 1px solid #a7f3d0; color: #065f46; padding: 1rem; border-radius: 0.25rem; margin-bottom: 1rem; text-align: center;';
					successMessage.textContent = 'Phiếu gửi mẫu đã được gửi thành công!';

					const container = document.querySelector('.container');
					const title = container.querySelector('h1');
					title.insertAdjacentElement('afterend', successMessage);

					// Reset button
					submitButton.textContent = originalText;
					submitButton.disabled = false;

					// Scroll to success message
					successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' }); // Here you would typically redirect or reset the form
				}, 2000);
			}

			// Function to add additional info row
			function addAdditionalInfo(button) {
				const container = button.parentElement.querySelector('.additional-info-container');

				// Define common field options similar to CreateReceiptFromCRM.jsx
				const commonFields = [
					'Tên mẫu thử / name.',
					'Số lô / LOT no.',
					'Ngày sản xuất / mfg.',
					'Hạn sử dụng / exp.',
					'Nơi sản xuất / mfr.',
					'Số công bố / pub. no.',
					'Số đăng ký / reg. no.',
				];

				// Create the new item with editable field
				const newItem = document.createElement('div');
				newItem.className = 'additional-info-item';
				newItem.innerHTML = `
					<div style="position: relative; display: inline-block;">
						<input type="text" class="editable-field-input" value="Tên trường mới" placeholder="Tên trường" />
						<div class="field-dropdown">
							${commonFields.map((field) => `<div class="field-dropdown-item" data-value="${field}">${field}</div>`).join('')}
						</div>
					</div>
					<input type="text" class="additional-info-input" data-field="custom" placeholder="Nhập giá trị" style="flex: 1; padding: 6px 8px; border: none; background-color: white;" />
					<button type="button" class="remove-btn" onclick="removeAdditionalInfo(this)" style="background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 4px; opacity: 0.7;">×</button>
				`;

				container.appendChild(newItem);

				// Setup event listeners for the editable field
				setupEditableField(newItem); // Update dropdown
				setTimeout(updateCopyFromDropdown, 100);
			}

			// Function to remove additional info row
			function removeAdditionalInfo(button) {
				const container = button.closest('.additional-info-container');
				if (container.children.length > 1) {
					button.closest('.additional-info-item').remove();
					// Update dropdown
					setTimeout(updateCopyFromDropdown, 100);
				} else {
					alert('Phải có ít nhất một thông tin!');
				}
			}
			// Function to add a new analysis parameter
			function addAnalysisParameter(button) {
				const sampleSection = button.closest('.sample-section');
				const analysisContainer = sampleSection.querySelector('.analysis-container');
				const parameterInput = sampleSection.querySelector('.new-parameter-input');

				if (parameterInput.value.trim() === '') {
					alert('Vui lòng nhập tên chỉ tiêu!');
					return;
				}
				const newItem = document.createElement('div');
				newItem.className = 'analysis-item';
				newItem.innerHTML = `
					<input type="text" class="parameter-name-input" value="${parameterInput.value.trim()}" placeholder="Tên chỉ tiêu" style="flex: 1; padding: 6px 2px; border: 1px solid #d1d5db; border-radius: 4px; min-width: 0; background-color: white;">
					<input type="text" class="parameter-price-input" placeholder="Giá" readonly style="width: 80px; padding: 6px 2px; border: 1px solid #d1d5db; border-radius: 4px; background-color: #f3f4f6; cursor: not-allowed;">
					<button type="button" class="remove-btn" onclick="removeAnalysisRow(this)" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">×</button>
				`;
				analysisContainer.appendChild(newItem); // Clear the input field after adding
				parameterInput.value = '';

				// Update dropdown
				setTimeout(updateCopyFromDropdown, 100);
			}

			// Function to remove an analysis parameter row
			function removeAnalysisRow(button) {
				const item = button.closest('.analysis-item');
				item.remove();

				// Update dropdown
				setTimeout(updateCopyFromDropdown, 100);
			}

			// Function to get cookie by name
			function getCookie(name) {
				const value = `; ${document.cookie}`;
				const parts = value.split(`; ${name}=`);
				if (parts.length === 2) return parts.pop().split(';').shift();
				return null;
			} // Function to check auth cookie and update UI
			function checkAuthCookieAndUpdateUI() {
				const authCookie = getCookie('auth');
				const analysisInputContainers = document.querySelectorAll('.analysis-input-container');
				const parametersContainers = document.querySelectorAll('.parameters-container');

				// Always show analysis input containers and parameters containers
				analysisInputContainers.forEach((container) => {
					container.style.display = 'flex';
				});
				parametersContainers.forEach((container) => {
					container.style.display = 'block';
				});
			}

			// Function to sync sample name with hidden name field
			function syncSampleNameWithHiddenField(sampleSection) {
				const sampleNameInput = sampleSection.querySelector('.sample-name');
				const hiddenNameField = Array.from(sampleSection.querySelectorAll('.additional-info-item')).find((item) => {
					const editableInput = item.querySelector('.editable-field-input');
					return editableInput && editableInput.value === 'Tên mẫu thử / name.';
				});

				if (sampleNameInput && hiddenNameField) {
					const valueInput = hiddenNameField.querySelector('.additional-info-input');
					if (valueInput) {
						valueInput.value = sampleNameInput.value;
					}
				}
			}

			// Add event delegation for sample name inputs
			document.addEventListener('input', function (e) {
				if (e.target.classList.contains('sample-name')) {
					const sampleSection = e.target.closest('.sample-section');
					if (sampleSection) {
						syncSampleNameWithHiddenField(sampleSection);
						// Update copy dropdown
						setTimeout(updateCopyFromDropdown, 100);
					}
				}
			});

			// Initialize first sample on page load
			document.addEventListener('DOMContentLoaded', function () {
				// Add first sample
				addSample();
			});
		</script>
	</body>
