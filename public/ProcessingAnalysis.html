								<label style="font-size: 12px; color: #6b7280;">Từ ngày:</label>
								<input type="date" 
									   class="date-input" 
									   value="${currentFilter.from || ''}"
									   onchange="updateDateFilter('${column}', 'from', this.value)">
								<label style="font-size: 12px; color: #6b7280;">Đến ngày:</label>
								<input type="date" 
									   class="date-input" 
									   value="${currentFilter.to || ''}"
									   onchange="updateDateFilter('${column}', 'to', this.value)">
								<button onclick="clearHeaderFilter('${column}')" 
										style="padding: 4px 8px; background: #ef4444; color: white; border: none; border-radius: 4px; font-size: 12px; margin-top: 8px;">
									Xóa bộ lọc
								</button>
							</div>
						</div>
					`;
				} else if (filterType === 'select') {
					content = `
						<div class="header-filter-content">
							<select class="header-filter-input" onchange="updateHeaderFilter('${column}', this.value)">
								<option value="">Tất cả</option>
								<option value="has_file" ${filters.headerFilters[column] === 'has_file' ? 'selected' : ''}>Có tài liệu</option>
								<option value="no_file" ${filters.headerFilters[column] === 'no_file' ? 'selected' : ''}>Không có tài liệu</option>
							</select>
							<div style="margin-top: 8px;">
								<button onclick="clearHeaderFilter('${column}')" 
										style="padding: 4px 8px; background: #ef4444; color: white; border: none; border-radius: 4px; font-size: 12px;">
									Xóa bộ lọc
								</button>
							</div>
						</div>
					`;
				}

				dropdown.innerHTML = content;
				return dropdown;
			}

			// Position header filter dropdown
			function positionHeaderFilter(dropdown, button) {
				const rect = button.getBoundingClientRect();

				let top = rect.bottom + 5;
				let left = rect.left;

				// Adjust if dropdown goes off screen
				if (left + 200 > window.innerWidth) {
					left = window.innerWidth - 210;
				}

				if (top + 200 > window.innerHeight) {
					top = rect.top - 200 - 5;
				}

				dropdown.style.top = top + 'px';
				dropdown.style.left = left + 'px';
			}

			// Update header filter
			function updateHeaderFilter(column, value) {
				if (value && value.trim()) {
					filters.headerFilters[column] = value.trim();
				} else {
					delete filters.headerFilters[column];
				}

				// Update filter icon appearance
				updateFilterIconState(column);

				// Update URL with filter changes
				updateURLWithFilters();

				// Debounce the API call
				clearTimeout(window.filterTimeout);
				window.filterTimeout = setTimeout(() => {
					fetchData();
				}, 300);
			}

			// Update date filter
			function updateDateFilter(column, type, value) {
				if (!filters.headerFilters[column]) {
					filters.headerFilters[column] = {};
				}

				if (value) {
					filters.headerFilters[column][type] = value;
				} else {
					delete filters.headerFilters[column][type];
				}

				// Remove empty filter object
				if (Object.keys(filters.headerFilters[column]).length === 0) {
					delete filters.headerFilters[column];
				}

				updateFilterIconState(column);
				updateURLWithFilters(); // Update URL with date filter changes
				fetchData();
			}

			// Clear header filter
			function clearHeaderFilter(column) {
				delete filters.headerFilters[column];
				updateFilterIconState(column);
				updateURLWithFilters(); // Update URL with cleared filter
				closeAllHeaderFilters();
				fetchData();
			}

			// Update filter icon state
			function updateFilterIconState(column) {
				const filterIcon = document.querySelector(`[onclick*="toggleHeaderFilter('${column}'"]`);
				if (filterIcon) {
					if (filters.headerFilters[column]) {
						filterIcon.classList.add('active');
					} else {
						filterIcon.classList.remove('active');
					}
				}
			}

			// Close all header filters
			function closeAllHeaderFilters() {
				const dropdowns = document.querySelectorAll('.header-filter-dropdown');
				dropdowns.forEach((dropdown) => {
					dropdown.classList.remove('show');
				});
			} // Sort by column
			function sortByColumn(column) {
				if (filters.columnSort === column) {
					filters.sortBy = filters.sortBy === 'ASC' ? 'DESC' : 'ASC';
				} else {
					filters.columnSort = column;
					filters.sortBy = 'ASC';
				}

				// Re-render headers to update sort icons
				renderTableHeaders();
				fetchData();
			}

			// Show error message
			function showError(message) {
				const errorMessage = document.getElementById('errorMessage');
				const errorText = document.getElementById('errorText');

				if (errorMessage && errorText) {
					errorText.textContent = message;
					errorMessage.classList.remove('hidden');

					setTimeout(() => {
						errorMessage.classList.add('hidden');
					}, 5000);
				}
			}

			// Show loading indicator
			function showLoading() {
				const loadingIndicator = document.getElementById('loadingIndicator');
				const tableContainer = document.getElementById('tableContainer');
				const emptyState = document.getElementById('emptyState');

				if (loadingIndicator) loadingIndicator.classList.remove('hidden');
				if (tableContainer) tableContainer.classList.add('hidden');
				if (emptyState) emptyState.classList.add('hidden');
			}

			// Hide loading indicator
			function hideLoading() {
				const loadingIndicator = document.getElementById('loadingIndicator');
				if (loadingIndicator) loadingIndicator.classList.add('hidden');
			}

			// Show empty state but keep table headers visible
			function showEmptyState() {
				const tableContainer = document.getElementById('tableContainer');
				const tableBody = document.getElementById('tableBody');
				const emptyState = document.getElementById('emptyState');

				// Show table container to keep headers visible
				if (tableContainer) tableContainer.classList.remove('hidden');

				// Clear table body but keep headers
				if (tableBody) {
					tableBody.innerHTML =
						'<tr><td colspan="100%" class="text-center py-8 text-gray-500">Không có dữ liệu</td></tr>';
				}

				// Hide the separate empty state element
				if (emptyState) emptyState.classList.add('hidden');
			}

			// Show table with data
			function showTable() {
				const tableContainer = document.getElementById('tableContainer');
				const emptyState = document.getElementById('emptyState');

				if (tableContainer) tableContainer.classList.remove('hidden');
				if (emptyState) emptyState.classList.add('hidden');
			}

			// Render table data
			function renderTableData() {
				const tableBody = document.getElementById('tableBody');
				if (!tableBody) return;

				if (data.length === 0) {
					showEmptyState();
					return;
				}

				showTable();

				const rows = data.map((item, index) => {
					const row = document.createElement('tr');
					const rowId = String(item.id || index);

					// Add click event for row selection
					row.addEventListener('click', (e) => {
						console.log('Row clicked:', rowId, e.target);

						// Don't select if clicking on interactive elements
						const target = e.target;
						if (
							target.tagName === 'BUTTON' ||
							target.tagName === 'A' ||
							target.closest('button') ||
							target.closest('a')
						) {
							console.log('Clicked on interactive element, skipping selection');
							return;
						}

						toggleRowSelection(rowId, row, item);
					});

					// Add drag events for row selection
					row.addEventListener('mousedown', (e) => {
						handleDragStart(e, index);
					});

					row.addEventListener('mouseenter', (e) => {
						handleDragMove(e, index);
					});

					// Global mouseup event will be handled by document listener

					// Prevent text selection on double click
					row.addEventListener('selectstart', (e) => {
						e.preventDefault();
					});

					filters.columns.forEach((column) => {
						// Skip 'id' column - don't display it but keep it for data processing
						if (column === 'id') return;

						const td = document.createElement('td');
						let value = item[column];

						// Handle special cases
						if (column === 'protocol_code' && (!value || value === 'null')) {
							value = '';
						}

						if (column === 'doc_id') {
							// File ID column - show document icon if doc_id exists
							if (value) {
								td.innerHTML = `<span class="document-icon" onclick="openDocument('${value}')">📄</span>`;
							} else {
								td.textContent = '';
							}
						} else if (column === 'deadline') {
							// Format deadline as DD/MM/YYYY
							if (value) {
								const date = new Date(value);
								if (!isNaN(date.getTime())) {
									td.textContent = date.toLocaleDateString('vi-VN');
								} else {
									td.textContent = '';
								}
							} else {
								td.textContent = '';
							}
						} else if (column === 'document') {
							if (item.doc_id) {
								td.innerHTML = `<button onclick="openDocument('${item.doc_id}')" class="text-blue-600 hover:text-blue-800 underline">Xem</button>`;
							} else {
								td.textContent = '-';
							}
						} else if (column === 'result_value' || column === 'result_unit') {
							// Display HTML content for result_value and result_unit
							if (value && typeof value === 'string') {
								td.innerHTML = value;
							} else {
								td.textContent = value || '';
							}
							// Make cell editable
							makeCellEditable(td, item, column);
						} else if (column === 'protocol_source') {
							// Display text content for protocol_source
							td.textContent = value || '';
							// Make cell editable with select dropdown
							makeCellEditable(td, item, column);
						} else if (column === 'protocol_code') {
							// Handle HTML content in protocol code column - strip HTML
							if (value && typeof value === 'string' && value.includes('<')) {
								// Strip HTML tags and get text content
								const tempDiv = document.createElement('div');
								tempDiv.innerHTML = value;
								td.textContent = tempDiv.textContent || tempDiv.innerText || '';
							} else {
								td.textContent = value || '';
							}
							// Make cell editable with input
							makeCellEditable(td, item, column);
						} else {
							td.textContent = value || '';
						}

						row.appendChild(td);
					});

					// Check if this row should be selected and apply appropriate styling
					if (selectedRows.has(rowId)) {
						row.classList.add('selected-row');
					} else {
						// Apply normal zebra striping
						if (index % 2 === 0) {
							// Even rows - white background (default)
						} else {
							// Odd rows - light gray background
							row.style.backgroundColor = '#f8fafc';
						}
					}

					return row;
				});

				tableBody.innerHTML = '';
				rows.forEach((row) => tableBody.appendChild(row));
			}

			// Fetch data from API with state preservation
			async function fetchData(isAutoRefresh = false) {
				// If this is an auto-refresh, store current state
				let preservedState = null;
				if (isAutoRefresh) {
					preservedState = preserveCurrentState();
					if (!preservedState.shouldRefresh) {
						console.log('Skipping auto-refresh - user is editing');
						return;
					}
				}

				if (!isAutoRefresh) {
					showLoading();
				} else {
					isRefreshing = true;
				}

				try {
					// Prepare columns for API - always include 'id' but don't display it
					const apiColumns = [...filters.columns];
					if (!apiColumns.includes('id')) {
						apiColumns.push('id');
					}

					// Prepare request body
					const requestBody = {
						itemsPerPage: pagination.itemsPerPage,
						page: pagination.currentPage,
						columns: apiColumns,
						columnSort: filters.columnSort,
						sortBy: filters.sortBy,
					};

					// Add filters based on search inputs
					if (searchInputs.matrix) {
						requestBody.matrix = searchInputs.matrix;
					}

					if (searchInputs.sampleUID) {
						const sampleUIDs = searchInputs.sampleUID
							.split(',')
							.map((s) => s.trim())
							.filter((s) => s);
						if (sampleUIDs.length > 0) {
							requestBody.sampleUIDs = sampleUIDs;
						}
					}

					if (filters.parameters.length > 0) {
						requestBody.parameters = filters.parameters;
					}

					if (filters.protocols.length > 0) {
						requestBody.protocols = filters.protocols;
					}

					if (searchInputs.parameter) {
						const parameters = searchInputs.parameter
							.split(',')
							.map((s) => s.trim())
							.filter((s) => s);
						if (parameters.length > 0) {
							requestBody.parameters = parameters;
						}
					}

					if (searchInputs.protocol) {
						const protocols = searchInputs.protocol
							.split(',')
							.map((s) => s.trim())
							.filter((s) => s);
						if (protocols.length > 0) {
							requestBody.protocols = protocols;
						}
					}

					if (searchInputs.resultStatus) {
						requestBody.isSubmitResult = searchInputs.resultStatus === 'true';
					}

					// Add header filters
					Object.keys(filters.headerFilters).forEach((column) => {
						const filterValue = filters.headerFilters[column];

						if (column === 'sample_uid' && filterValue) {
							if (!requestBody.sampleUIDs) requestBody.sampleUIDs = [];
							// Handle both string and array values
							const values = Array.isArray(filterValue)
								? filterValue
								: filterValue
										.split(',')
										.map((s) => s.trim())
										.filter((s) => s);
							requestBody.sampleUIDs = requestBody.sampleUIDs.concat(values);
						} else if (column === 'parameter_name' && filterValue) {
							if (!requestBody.parameters) requestBody.parameters = [];
							// Handle both string and array values
							const values = Array.isArray(filterValue)
								? filterValue
								: filterValue
										.split(',')
										.map((s) => s.trim())
										.filter((s) => s);
							requestBody.parameters = requestBody.parameters.concat(values);
						} else if (column === 'matrix' && filterValue) {
							requestBody.matrix = filterValue;
						} else if (column === 'protocol_code' && filterValue) {
							if (!requestBody.protocols) requestBody.protocols = [];
							// Handle both string and array values
							const values = Array.isArray(filterValue)
								? filterValue
								: filterValue
										.split(',')
										.map((s) => s.trim())
										.filter((s) => s);
							requestBody.protocols = requestBody.protocols.concat(values);
						} else if (column === 'deadline' && filterValue) {
							if (filterValue.from) requestBody.deadlineFrom = filterValue.from;
							if (filterValue.to) requestBody.deadlineTo = filterValue.to;
						} else if (column === 'doc_id' && filterValue) {
							if (filterValue === 'has_file') {
								requestBody.hasDocument = true;
							} else if (filterValue === 'no_file') {
								requestBody.hasDocument = false;
							}
						}
					});

					if (filters.documentStatus) {
						requestBody.documentStatus = filters.documentStatus;
					}

					const response = await apiPost(API_ENDPOINT, requestBody);

					if (!response.status > 300) {
						throw new Error(`HTTP error! status: ${response.status}`);
					}

					const result = await response.data;

					if (result.result) {
						data = result.result;

						// Update pagination from API response
						if (result.pagination) {
							pagination.currentPage = result.pagination.currentPage;
							pagination.itemsPerPage = result.pagination.itemsPerPage;
							pagination.totalItems = result.pagination.totalItems;
							pagination.totalPages = result.pagination.totalPages;
						} else {
							// Fallback for backward compatibility
							pagination.totalItems = result.total || 0;
							pagination.totalPages = Math.ceil(pagination.totalItems / pagination.itemsPerPage);
						}

						renderTableData();
						updatePaginationControls();

						// Update URL with current filters if not auto-refresh
						if (!isAutoRefresh) {
							updateURLWithFilters();
						}

						// Restore state if this was an auto-refresh
						if (isAutoRefresh && preservedState) {
							restorePreservedState(preservedState);
						}

						// Store original data state for change tracking
						data.forEach((item) => {
							originalDataState[item.id] = { ...item };
						});
					} else {
						throw new Error('No data received from server');
					}
				} catch (error) {
					console.error('Error fetching data:', error);
					showError('Lỗi khi tải dữ liệu: ' + error.message);
					showEmptyState();
				} finally {
					if (!isAutoRefresh) {
						hideLoading();
					} else {
						isRefreshing = false;
					}
				}
			}

			// Preserve current user state for auto-refresh
			function preserveCurrentState() {
				// Check if user is currently editing any cell
				const editingCells = document.querySelectorAll('tbody .editing');
				if (editingCells.length > 0) {
					return { shouldRefresh: false };
				}

				// Check if any dropdown is open
				const openDropdowns = document.querySelectorAll('.dropdown.show');
				if (openDropdowns.length > 0) {
					return { shouldRefresh: false };
				}

				// Check if TinyMCE is active
				if (currentEditor) {
					return { shouldRefresh: false };
				}

				// Store current scroll position
				const tableContainer = document.querySelector('.table-container');
				const scrollTop = tableContainer ? tableContainer.scrollTop : 0;
				const scrollLeft = tableContainer ? tableContainer.scrollLeft : 0;

				return {
					shouldRefresh: true,
					scrollTop,
					scrollLeft,
					currentPage: pagination.currentPage,
				};
			}

			// Restore preserved state after auto-refresh
			function restorePreservedState(state) {
				// Restore scroll position
				setTimeout(() => {
					const tableContainer = document.querySelector('.table-container');
					if (tableContainer) {
						tableContainer.scrollTop = state.scrollTop || 0;
						tableContainer.scrollLeft = state.scrollLeft || 0;
					}
				}, 100);
			}

			// Auto-refresh management
			function startAutoRefresh() {
				if (autoRefreshInterval) {
					clearInterval(autoRefreshInterval);
				}

				// Auto-refresh every 60 seconds (1 minute)
				autoRefreshInterval = setInterval(() => {
					if (!isRefreshing) {
						console.log('Auto-refreshing data...');
						fetchData(true);
					}
				}, 60000);

				console.log('Auto-refresh started (every 60 seconds)');
			}

			function stopAutoRefresh() {
				if (autoRefreshInterval) {
					clearInterval(autoRefreshInterval);
					autoRefreshInterval = null;
					console.log('Auto-refresh stopped');
				}
			} // Update pagination controls
			function updatePaginationControls() {
				const currentPageEl = document.getElementById('currentPage');
				const totalPagesEl = document.getElementById('totalPages');
				const totalItemsEl = document.getElementById('totalItems');
				const prevButton = document.getElementById('prevButton');
				const nextButton = document.getElementById('nextButton');
				const pageInput = document.getElementById('pageInput');

				if (currentPageEl) currentPageEl.textContent = pagination.currentPage;
				if (totalPagesEl) totalPagesEl.textContent = pagination.totalPages;
				if (totalItemsEl) totalItemsEl.textContent = pagination.totalItems;

				// Update page input attributes
				if (pageInput) {
					pageInput.max = pagination.totalPages;
					pageInput.value = pagination.currentPage;
				}

				if (prevButton) {
					prevButton.disabled = pagination.currentPage <= 1;
				}

				if (nextButton) {
					nextButton.disabled = pagination.currentPage >= pagination.totalPages;
				}
			}

			// Document navigation function
			async function openDocument(docId) {
				// Check if doc_id starts with 'edit_'
				if (docId && docId.includes('edit')) {
					// Open EditorTemplate.html with docId parameter
					const editorUrl = `../EditorTemplate.html?docId=${docId}`;
					window.open(editorUrl, '_blank');
				} else if (docId && docId.includes('Doc')) {
					// Call API to preview document
					try {
						const response = await apiPost('https://red.irdop.org/v1/document/preview_doc', {
							id: docId,
						});

						if (response && response.status >= 200 && response.status < 300) {
							// Handle successful response - could be URL or data
							if (response.data && typeof response.data === 'string') {
								if (response.data.startsWith('http')) {
									// If response is a URL, open it
									window.open(response.data, '_blank');
								} else {
									// If response is HTML content, open in a new popup window
									const popup = window.open('', '_blank', 'width=800,height=800,scrollbars=yes,resizable=yes');
									if (popup) {
										popup.document.open();
										popup.document.write(response.data);
										popup.document.close();
									} else {
										showErrorNotification('Không thể mở cửa sổ popup. Vui lòng kiểm tra cài đặt trình duyệt.');
									}
								}
							} else {
								// Handle other response formats
								console.log('Document preview response:', response.data);
							}
						} else {
							showErrorNotification('Không thể xem tài liệu: ' + (response.data || 'Lỗi không xác định'));
						}
					} catch (error) {
						console.error('Error previewing document:', error);
						showErrorNotification('Lỗi khi xem tài liệu: ' + error.message);
					}
				} else {
					// Implementation for opening other document types
					console.log('Opening document:', docId);
				}
			}

			// Initialize the application
			function init() {
				// Load filters from URL first
				loadFiltersFromURL();

				// Initialize inline editor
				initInlineEditor();

				// Initialize column checkboxes
				initializeColumnCheckboxes();

				// Initialize sidebar
				initializeSidebar();

				// Set up event listeners
				const confirmColumnsBtn = document.getElementById('confirmColumnsBtn');
				if (confirmColumnsBtn) {
					confirmColumnsBtn.addEventListener('click', () => {
						updateColumns();
						closeAllDropdowns();
					});
				}

				const resetColumnsBtn = document.getElementById('resetColumnsBtn');
				if (resetColumnsBtn) {
					resetColumnsBtn.addEventListener('click', () => {
						// Reset to default columns (including 'id' for API but not displayed)
						filters.columns = [
							'id',
							'sample_uid',
							'parameter_name',
							'matrix',
							'protocol_source',
							'protocol_code',
							'result_value',
							'result_unit',
							'deadline',
							'doc_id',
						];
						initializeColumnCheckboxes();
						updateColumns();
						closeAllDropdowns();
					});
				}

				const itemsPerPageSelect = document.getElementById('itemsPerPageSelect');
				if (itemsPerPageSelect) {
					itemsPerPageSelect.addEventListener('change', (e) => {
						pagination.itemsPerPage = parseInt(e.target.value);
						pagination.currentPage = 1;
						updateURLWithFilters(); // Update URL with new itemsPerPage
						fetchData();
					});
				}

				const prevButton = document.getElementById('prevButton');
				if (prevButton) {
					prevButton.addEventListener('click', () => {
						if (pagination.currentPage > 1) {
							pagination.currentPage--;
							updateURLWithFilters(); // Update URL with new page
							fetchData();
						}
					});
				}

				const nextButton = document.getElementById('nextButton');
				if (nextButton) {
					nextButton.addEventListener('click', () => {
						if (pagination.currentPage < pagination.totalPages) {
							pagination.currentPage++;
							updateURLWithFilters(); // Update URL with new page
							fetchData();
						}
					});
				}

				// Page input functionality
				const currentPageDisplay = document.getElementById('currentPageDisplay');
				const pageInput = document.getElementById('pageInput');
				const currentPageSpan = document.getElementById('currentPage');

				if (currentPageDisplay && pageInput && currentPageSpan) {
					// Click on current page to edit
					currentPageDisplay.addEventListener('click', () => {
						// Hide display span and show input
						currentPageSpan.style.display = 'none';
						pageInput.style.display = 'inline-block';
						pageInput.classList.remove('hidden');
						pageInput.value = pagination.currentPage;
						pageInput.focus();
						pageInput.select();
					});

					// Handle page input events
					pageInput.addEventListener('blur', () => {
						handlePageInputChange();
					});

					pageInput.addEventListener('keydown', (e) => {
						if (e.key === 'Enter') {
							e.preventDefault();
							handlePageInputChange();
						} else if (e.key === 'Escape') {
							e.preventDefault();
							cancelPageInput();
						}
					});

					// Function to handle page input change
					function handlePageInputChange() {
						const newPage = parseInt(pageInput.value);
						if (newPage && newPage >= 1 && newPage <= pagination.totalPages && newPage !== pagination.currentPage) {
							pagination.currentPage = newPage;
							updateURLWithFilters();
							fetchData();
						}
						resetPageInput();
					}

					// Function to cancel page input
					function cancelPageInput() {
						pageInput.value = pagination.currentPage;
						resetPageInput();
					}

					// Function to reset page input display
					function resetPageInput() {
						pageInput.style.display = 'none';
						pageInput.classList.add('hidden');
						currentPageSpan.style.display = 'inline';
					}
				}

				// Click outside to close dropdowns
				document.addEventListener('click', (e) => {
					const isColumnButton = e.target.closest('.column-display-btn');
					const isColumnDropdown = e.target.closest('.filter-dropdown');
					const isHeaderFilter = e.target.closest('.header-filter-dropdown');
					const isFilterIcon = e.target.closest('.filter-icon');

					if (!isColumnButton && !isColumnDropdown) {
						closeAllDropdowns();
					}

					if (!isHeaderFilter && !isFilterIcon) {
						closeAllHeaderFilters();
					}
				});

				// Global event listeners for drag selection
				document.addEventListener('mouseup', handleDragEnd);
				document.addEventListener('mouseleave', handleDragEnd);

				// Global click listener to close inline editor when clicking outside
				document.addEventListener('click', (e) => {
					if (currentEditingCell && !currentEditingCell.contains(e.target)) {
						saveInlineEdit();
					}
				});

				// Prevent text selection during drag
				document.addEventListener('selectstart', (e) => {
					if (isDragging) {
						e.preventDefault();
					}
				});

				// Render initial table headers
				renderTableHeaders();

				// Load initial data
				fetchData();

				// Start auto-refresh after initial load
				startAutoRefresh();

				// Initialize clear all filters button visibility
				updateClearAllFiltersButtonVisibility();
			} // Make functions globally accessible for inline event handlers
			window.toggleColumnFilter = toggleColumnFilter;
			window.toggleParameterSelection = toggleParameterSelection;
			window.clearAllParameters = clearAllParameters;
			window.clearAllFilters = clearAllFilters;
			window.updateClearAllFiltersButtonVisibility = updateClearAllFiltersButtonVisibility;
			window.rebuildSelectedParametersFromHeaderFilters = rebuildSelectedParametersFromHeaderFilters;
			window.resetParameterSearch = resetParameterSearch;
			window.openDocument = openDocument;
			window.clearAllSelections = clearAllSelections;
			window.toggleSidebar = toggleSidebar;
			window.openEditor = openEditor;
			window.sortByColumn = sortByColumn;
			window.toggleHeaderFilter = toggleHeaderFilter;
			window.updateHeaderFilter = updateHeaderFilter;
			window.updateDateFilter = updateDateFilter;
			window.clearHeaderFilter = clearHeaderFilter;

			// Start the application
			document.addEventListener('DOMContentLoaded', init);
		</script>
	</body>
</html>
