<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Phiếu gửi mẫu - IRDOP</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				background: #f8f9fa;
				margin: 0;
				padding: 0;
			}
			.container {
				max-width: 900px;
				margin: 40px auto;
				background: #fff;
				border-radius: 8px;
				box-shadow: 0 2px 8px #0001;
				padding: 24px;
				min-height: 400px;
			}
			.loading {
				color: #555;
				font-size: 1.2em;
			}
			.error {
				color: #c00;
				font-weight: bold;
				margin: 24px 0;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div id="loading" class="loading">Đang tải phiếu gửi mẫu...</div>
			<div id="error" class="error" style="display: none"></div>
			<div id="content"></div>
		</div>
		<script>
			function getQueryParam(name) {
				const url = new URL(window.location.href);
				return url.searchParams.get(name);
			}
			const orderCode = getQueryParam('orderCode');
			const uri = getQueryParam('uri');
			const loadingDiv = document.getElementById('loading');
			const errorDiv = document.getElementById('error');
			const contentDiv = document.getElementById('content');

			if (!orderCode || !uri) {
				loadingDiv.style.display = 'none';
				errorDiv.style.display = 'block';
				errorDiv.textContent = 'Thiếu thông tin orderCode hoặc uri.';
			} else {
				fetch(
					`https://black.irdop.org/db/order/get_req_form?orderCode=${encodeURIComponent(
						orderCode,
					)}&uri=${encodeURIComponent(uri)}`,
				)
					.then(async (res) => {
						if (res.status === 200) {
							const html = await res.text();
							document.open();
							document.write(html);
							document.close();
						} else {
							throw new Error('Không nhận được dữ liệu hợp lệ từ server.');
						}
					})
					.catch((err) => {
						loadingDiv.style.display = 'none';
						errorDiv.style.display = 'block';
						errorDiv.textContent = err.message || 'Không thể tải phiếu gửi mẫu.';
					});
			}
		</script>
	</body>
</html>
